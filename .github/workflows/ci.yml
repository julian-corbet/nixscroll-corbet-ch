name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    # This suite now builds cscroll and boots an ephemeral NixOS VM. It is
    # intentionally hosted by GHA for this public repository, not by a private
    # fleet runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      - name: Allow the NixOS VM test to use KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          fi

      # Evaluate every declared architecture, then execute the checks that this
      # runner can build. --all-systems can also select foreign builds on newer
      # Nix versions; an x86 runner has no aarch64 execution backend.
      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build

      - name: Build and test the native system
        run: nix flake check --keep-going --print-build-logs
